{% extends 'base.html' %}
{% block content %}
    <section class="panel">
        <h1>Мои отклики</h1>
        <div class="responses-list">
            {% for response in responses %}
                <article class="panel">
                    <a href="{% url 'detail' response.item.pk %}"><b>{{ response.item.title }}</b></a>
                    <p>{{ response.message }}</p>
                    <small style="color:var(--muted)">Телефон: {{ response.phone }}</small>
                </article>
            {% empty %}
                <div class="empty-state">Вы пока не отправляли отклики.</div>
            {% endfor %}
        </div>
    </section>
{% endblock %}
